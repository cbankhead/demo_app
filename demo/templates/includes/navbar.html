
{% load static %}
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <!-- Brand Link linking to the home page -->
    <a class="navbar-brand" href="{% url 'home' %}"><i class="bi-house-fill" style="font-size: 2.0em; color: gray;"></i></a>
    
    <!-- Mobile Hamburger Menu Button -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    
    <!-- Collapsible Menu Wrapper -->
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        {% if user.is_authenticated %}
        <li class="nav-item">
          <a class="nav-link" href="{% url 'aws_tools' %}">AWS Tools</a>
        </li>
         <li class="nav-item">
          <a class="nav-link" href="{% url 'azure_tools' %}">Azure Tools</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'gcp_tools' %}">GCP Tools</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'cidr_calculator' %}">CIDR Calc</a>
        </li>
        {% endif %}
      </ul>
      
      <!-- Right Aligned Authentication Navigation Items -->
      <ul class="navbar-nav ms-auto">
        {% if user.is_authenticated %}
          <li class="nav-item">
            <span class="navbar-text me-3">Welcome, {{ user.username }}</span>
          </li>
          <li class="nav-item">
            <form action="{% url 'logout' %}" method="post" class="d-inline">
              {% csrf_token %}
              <button type="submit" class="btn btn-sm btn-outline-light">Logout</button>
            </form>
          </li>
        {% else %}
          <li class="nav-item">
            <a class="nav-link" href="{% url 'login' %}">Login</a>
          </li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
